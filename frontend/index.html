<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AgroVision AI</title><link rel="stylesheet" href="style.css"></head><body><main><header><p class="eyebrow">AGROVISION AI</p><h1>A calmer first step when a crop looks wrong.</h1><p>Upload a leaf photo for a transparent screening result. This demo does not replace an agronomist.</p></header><section class="card"><label>Crop<select id="crop"><option>tomato</option><option>maize</option><option>potato</option><option>unknown</option></select></label><label>Leaf photo<input id="image" type="file" accept="image/*"></label><button id="scan">Screen crop</button><pre id="result">Your result will appear here.</pre></section></main><script src="app.js"></script></body></html>
