<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#eef5ee">
    <title>AgroVision AI</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">AGROVISION AI</p>
        <h1>A calmer first step when a crop looks wrong.</h1>
        <p>Upload a leaf photo for a transparent screening result. This prototype does not replace an agronomist.</p>
      </header>
      <section class="card" aria-labelledby="scan-heading">
        <h2 id="scan-heading">Screen a crop photo</h2>
        <label for="crop">Crop</label>
        <select id="crop">
          <option value="tomato">Tomato</option>
          <option value="maize">Maize</option>
          <option value="potato">Potato</option>
          <option value="unknown">Other / not sure</option>
        </select>
        <label for="image">Leaf photo (JPEG, PNG, or WebP; up to 10 MB)</label>
        <input id="image" type="file" accept="image/jpeg,image/png,image/webp">
        <button id="scan" type="button">Screen crop</button>
        <p id="result" role="status" aria-live="polite">Your result will appear here.</p>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
