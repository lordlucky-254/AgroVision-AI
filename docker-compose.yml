services:
  agrovision:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      AGROVISION_MODEL_PATH: /app/models/agrovision.pth
    volumes:
      - ./models:/app/models:ro
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()
      interval: 30s
      timeout: 5s
      retries: 3
